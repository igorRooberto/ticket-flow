spring:
  application:
    name: Ticket-flow

  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_flow
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true